<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" role="img" aria-labelledby="title desc">
  <title id="title">AstraBuild closed-loop architecture</title>
  <desc id="desc">Evidence is compiled for Codex and GPT-6 Astra reasoning, converted to Blender and Python actions, validated by a deterministic harness, and written into persistent history for replanning.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#e8f2ff"/>
      <stop offset="1" stop-color="#f4f7ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#fff3dd"/>
      <stop offset="1" stop-color="#fff9ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1f2d3d" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#526071"/>
    </marker>
  </defs>
  <rect width="1320" height="560" rx="28" fill="#f7f8fa"/>
  <text x="56" y="55" font-size="26" font-family="Arial, sans-serif" font-weight="700" fill="#172033">AstraBuild · Evidence-grounded closed loop</text>
  <text x="56" y="86" font-size="15" font-family="Arial, sans-serif" fill="#687386">证据约束 · 程序化建模 · 确定性验证 · 持久历史</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="225" height="275" rx="22" fill="white"/>
    <text x="78" y="180" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#172033">Evidence context</text>
    <text x="78" y="205" font-size="13" font-family="Arial, sans-serif" fill="#778296">证据上下文</text>
    <g font-size="14" font-family="Arial, sans-serif" fill="#334155">
      <text x="78" y="248">• coarse photogrammetric mesh</text>
      <text x="78" y="284">• UAV / ground photographs</text>
      <text x="78" y="320">• inventory + 12MZ semantics</text>
      <text x="78" y="356">• prior batch history</text>
      <text x="78" y="392">• human review / markup</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="145" width="245" height="275" rx="22" fill="url(#g1)"/>
    <text x="380" y="180" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#172033">Agent reasoning</text>
    <text x="380" y="205" font-size="13" font-family="Arial, sans-serif" fill="#5d6f88">Codex + GPT-6 Astra</text>
    <text x="380" y="230" font-size="13" font-family="Arial, sans-serif" fill="#5d6f88">Extra High · user-confirmed</text>
    <g font-size="14" font-family="Arial, sans-serif" fill="#334155">
      <text x="380" y="278">inspect → hypothesize</text>
      <text x="380" y="314">select evidence domain</text>
      <text x="380" y="350">plan component hierarchy</text>
      <text x="380" y="386">diagnose validation feedback</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="145" width="235" height="275" rx="22" fill="white"/>
    <text x="700" y="180" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#172033">Executable actions</text>
    <text x="700" y="205" font-size="13" font-family="Arial, sans-serif" fill="#778296">Blender + Python</text>
    <g font-size="14" font-family="Arial, sans-serif" fill="#334155">
      <text x="700" y="248">• crop / inspect</text>
      <text x="700" y="284">• build / revise master</text>
      <text x="700" y="320">• instantiate / connect</text>
      <text x="700" y="356">• render review views</text>
      <text x="700" y="392">• quarantine / freeze</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="985" y="145" width="275" height="275" rx="22" fill="url(#g2)"/>
    <text x="1010" y="180" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#172033">Constrained validator</text>
    <text x="1010" y="205" font-size="13" font-family="Arial, sans-serif" fill="#7d684b">确定性验证层</text>
    <g font-size="14" font-family="Arial, sans-serif" fill="#334155">
      <text x="1010" y="248">hash + history preservation</text>
      <text x="1010" y="284">save / reopen structure</text>
      <text x="1010" y="320">rigid instances + finite geometry</text>
      <text x="1010" y="356">surface / contact / coverage checks</text>
      <text x="1010" y="392">explicit limitations + failures</text>
    </g>
  </g>

  <path d="M280 282 H345" fill="none" stroke="#526071" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 282 H665" fill="none" stroke="#526071" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M910 282 H975" fill="none" stroke="#526071" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M1120 430 C1120 500, 475 505, 475 430" fill="none" stroke="#526071" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="682" y="493" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#586779">feedback → immutable batch history → next decision</text>
</svg>

