<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect x="-10" y="-10" width="1100" height="1460" rx="0" fill="#fbfcfe" stroke="none" stroke-width="0"/><circle cx="72" cy="70" r="14" fill="#3d9a92"/><text x="100" y="82" text-anchor="start" font-family="Noto Serif CJK SC" font-size="34" font-weight="800" fill="#1f2a44"><tspan x="100" dy="0">AstraBuild</tspan></text><text x="84" y="160" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#3d9a92" letter-spacing="0.12em"><tspan x="84" dy="0">发现二</tspan></text><text x="84" y="250" text-anchor="start" font-family="Noto Sans CJK SC" font-size="60" font-weight="900" fill="#1f2a44"><tspan x="84" dy="0">持续状态是</tspan><tspan x="84" dy="76.8">一把双刃剑</tspan></text><rect x="84" y="480" width="444" height="500" rx="22" fill="#e9f7f5" stroke="#3d9a92" stroke-width="2.5"/><text x="306.0" y="540" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="36" font-weight="900" fill="#3d9a92"><tspan x="306.0" dy="0">组合</tspan></text><text x="120" y="620" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#37455e"><tspan x="120" dy="0">· B23 的新引线直接接到 B08</tspan><tspan x="120" dy="39.15"> 建好的端子上</tspan></text><text x="120" y="720.3" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#37455e"><tspan x="120" dy="0">· B29 的导线挂到既有线夹端</tspan><tspan x="120" dy="39.15">点</tspan></text><text x="120" y="820.5999999999999" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#37455e"><tspan x="120" dy="0">· B36 在 36,615 个既有对</tspan><tspan x="120" dy="39.15">象、7,114 个变换之上收尾</tspan></text><rect x="552" y="480" width="444" height="500" rx="22" fill="#fff1f1" stroke="#d86c6c" stroke-width="2.5"/><text x="774.0" y="540" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="36" font-weight="900" fill="#d86c6c"><tspan x="774.0" dy="0">传播</tspan></text><text x="588" y="620" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#37455e"><tspan x="588" dy="0">· B15 的共享母线节范围出错</tspan></text><text x="588" y="681.15" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#37455e"><tspan x="588" dy="0">· 同一通道把错误带进每个复</tspan><tspan x="588" dy="39.15">用安装位</tspan></text><text x="588" y="781.4499999999999" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#37455e"><tspan x="588" dy="0">· 直到“复用边界”本身被修订</tspan><tspan x="588" dy="39.15">才止住</tspan></text><rect x="84" y="1060" width="912" height="250" rx="20" fill="white" stroke="#d7dfe9" stroke-width="2"/><text x="540" y="1150" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" fill="#1f2a44"><tspan x="540" dy="0">没有持续状态，36 步的长链条根本不可能；</tspan><tspan x="540" dy="51.2">但上游的一个抽象决定，也会成为下游问题的一部分。</tspan></text><text x="1020" y="1396" text-anchor="end" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#5b6b84"><tspan x="1020" dy="0">5 / 7</tspan></text></svg>