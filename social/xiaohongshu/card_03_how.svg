<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect x="-10" y="-10" width="1100" height="1460" rx="0" fill="#fbfcfe" stroke="none" stroke-width="0"/><circle cx="72" cy="70" r="14" fill="#3d9a92"/><text x="100" y="82" text-anchor="start" font-family="Noto Serif CJK SC" font-size="34" font-weight="800" fill="#1f2a44"><tspan x="100" dy="0">AstraBuild</tspan></text><text x="84" y="160" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#3d9a92" letter-spacing="0.12em"><tspan x="84" dy="0">工作方式</tspan></text><text x="84" y="250" text-anchor="start" font-family="Noto Sans CJK SC" font-size="62" font-weight="900" fill="#1f2a44"><tspan x="84" dy="0">模型做决策</tspan><tspan x="84" dy="79.36">代码做计算</tspan></text><rect x="104" y="470" width="872" height="150" rx="22" fill="#edf4ff" stroke="#4d87d7" stroke-width="2.5"/><circle cx="170" cy="545" r="34" fill="#4d87d7"/><text x="170" y="557" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="38" font-weight="900" fill="white"><tspan x="170" dy="0">1</tspan></text><text x="232" y="530" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="800" fill="#1f2a44"><tspan x="232" dy="0">证据 + 继承状态</tspan></text><text x="232" y="578" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#37455e"><tspan x="232" dy="0">摄影测量粗模、现场影像、上一批的工程状态</tspan></text><path d="M540,624 V666" stroke="#5b6b84" stroke-width="4" stroke-linecap="round" marker-end="url(#dn)"/><rect x="104" y="670" width="872" height="150" rx="22" fill="#f4efff" stroke="#8f70da" stroke-width="2.5"/><circle cx="170" cy="745" r="34" fill="#8f70da"/><text x="170" y="757" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="38" font-weight="900" fill="white"><tspan x="170" dy="0">2</tspan></text><text x="232" y="730" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="800" fill="#1f2a44"><tspan x="232" dy="0">模型编写可执行程序</tspan></text><text x="232" y="778" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#37455e"><tspan x="232" dy="0">选证据、选表示、写 Blender/Python 操作</tspan></text><path d="M540,824 V866" stroke="#5b6b84" stroke-width="4" stroke-linecap="round" marker-end="url(#dn)"/><rect x="104" y="870" width="872" height="150" rx="22" fill="#fff3e8" stroke="#db8b33" stroke-width="2.5"/><circle cx="170" cy="945" r="34" fill="#db8b33"/><text x="170" y="957" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="38" font-weight="900" fill="white"><tspan x="170" dy="0">3</tspan></text><text x="232" y="930" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="800" fill="#1f2a44"><tspan x="232" dy="0">确定性工具构建与验证</tspan></text><text x="232" y="978" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#37455e"><tspan x="232" dy="0">拟合、变换、端点检查、碰撞检查全在代码里</tspan></text><path d="M540,1024 V1066" stroke="#5b6b84" stroke-width="4" stroke-linecap="round" marker-end="url(#dn)"/><rect x="104" y="1070" width="872" height="150" rx="22" fill="#e9f7f5" stroke="#3d9a92" stroke-width="2.5"/><circle cx="170" cy="1145" r="34" fill="#3d9a92"/><text x="170" y="1157" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="38" font-weight="900" fill="white"><tspan x="170" dy="0">4</tspan></text><text x="232" y="1130" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="800" fill="#1f2a44"><tspan x="232" dy="0">被接受的结果成为新状态</tspan></text><text x="232" y="1178" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="400" fill="#37455e"><tspan x="232" dy="0">命名 collection、端口、端点供后续批次寻址</tspan></text><defs><marker id="dn" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto"><path d="M0,0 L9,0 L4.5,8 z" fill="#5b6b84"/></marker></defs><rect x="84" y="1258" width="912" height="96" rx="18" fill="#e9f7f5" stroke="#3d9a92" s